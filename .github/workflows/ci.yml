name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Test (SQLite + fakeredis)
        run: pytest -v

  migrations:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shorty
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/shorty
      REDIS_URL: ""
      FLASK_APP: app:create_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Upgrade and check for model drift on MySQL
        run: |
          flask db upgrade
          flask db check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
